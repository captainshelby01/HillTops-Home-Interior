services:
  - type: web
    name: hilltops-home-interior
    env: php
    buildCommand: "composer install --no-interaction --prefer-dist --optimize-autoloader && npm install && npm run build && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force"
    startCommand: "vendor/bin/heroku-php-apache2 public/"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        value: base64:QUkLNYgjEiwhazPZc0vRa9c/PUGwu0RF7ZlGkqpH7v4=
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/database.sqlite
      - key: LOG_CHANNEL
        value: stderr
